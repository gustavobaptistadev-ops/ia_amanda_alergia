version: '3.8'

services:
  db:
    image: ankane/pgvector:latest
    container_name: ia_amanda_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ia_amanda}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: ia_amanda_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  evolution-api:
    image: atendai/evolution-api:latest
    container_name: ia_amanda_evolution
    ports:
      - "8081:8080"
    environment:
      - SERVER_URL=http://localhost:8081
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=1dcd4e3bc54541449f52c5e319d7eeda
      - DB_PROVIDER=postgresql
      - DB_CONNECTION_URI=postgresql://postgres:postgres@db:5432/ia_amanda
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      - db
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  evolution_instances:
