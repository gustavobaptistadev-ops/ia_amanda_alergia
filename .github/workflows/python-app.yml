name: IA Amanda CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./backend

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install ruff pytest
    - name: Lint with Ruff
      run: |
        # Verifica erros sintáticos e imports não usados (mas não quebra por estilo)
        ruff check .
    - name: Test with pytest
      run: |
        # Roda a bateria de testes unitários
        pytest tests/
